spring:
  application:
    name: codearena-api
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:codearena}?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:codearena}
    password: ${DB_PASSWORD:change-me}
  jpa:
    # 스키마는 Flyway가 관리하고, Hibernate는 엔티티와 테이블이 맞는지 검증만 한다
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

codearena:
  jwt:
    # 운영에서는 반드시 JWT_SECRET 환경변수로 32바이트 이상의 임의 문자열을 넣는다
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:1h}
  judge:
    # 채점 결과 큐 소비 스레드. 테스트나 API만 따로 띄울 때 false로 끌 수 있다
    result-consumer-enabled: ${JUDGE_RESULT_CONSUMER_ENABLED:true}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
