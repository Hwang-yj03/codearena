services:
  mysql:
    image: mysql:8.4
    container_name: codearena-mysql
    env_file: .env
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codearena-redis
    ports:
      - "6379:6379"

  judge-worker:
    build:
      context: .
      dockerfile: judge-worker/Dockerfile
      target: runtime
    container_name: codearena-judge-worker
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  mysql-data:
